# This workflow runs CI on a Linux ARM64 container using the official arm64v8 Node image.
# It checks out the code, installs pnpm, installs dependencies, runs lint, tests, builds the React app, and then builds & pushes a Docker image to GitHub Container Registry (GHCR).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: arm64v8/node:16
      # Use a non‑root user to avoid permission issues
      options: "--user node"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint || echo "No lint script defined"

      - name: Run tests
        run: pnpm test || echo "No test script defined"

      - name: Build production bundle
        run: pnpm build

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: linux/arm64
