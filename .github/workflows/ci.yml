# CI workflow: build React app on ubuntu-latest, then build & push
# a linux/arm64 Docker image to GHCR using QEMU emulation.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Build & test the React app ────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint || echo "No lint script defined"

      - name: Run tests
        run: pnpm test || echo "No test script defined"

      - name: Build production bundle
        env:
          # Disable the CRA ESLint plugin during build.
          # eslint-config-react-app's jest overrides use "jest/globals" which
          # is unsupported in newer eslint-plugin-jest versions.
          # Linting is already handled by the separate "Lint code" step above.
          DISABLE_ESLINT_PLUGIN: "true"
        run: pnpm build

  # ── 2. Build & push Docker image (linux/arm64) to GHCR ──────────────────
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name (GHCR requires lowercase)
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU (for cross-platform ARM64 build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          platforms: linux/arm64
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
